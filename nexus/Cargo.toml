[workspace]
members = [
  "crates/nexus-core",
  "crates/nexus-ui",
  "crates/nexus-clipboard",
  "crates/nexus-storage",
  "crates/nexus-search",
  "crates/nexus-emoji",
  "crates/nexus-symbols",
  "crates/nexus-gif",
  "crates/nexus-ipc",
  "crates/nexus-platform",
  "crates/nexus-config",
]

resolver = "2"

[patch.crates-io]
