[package]
name = "nexus-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui = "0.2.2"
libc = "0.2.189"
dirs = "5"
emojic = "0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
nexus-clipboard = { path = "../nexus-clipboard" }
nexus-storage = { path = "../nexus-storage" }
nexus-config = { path = "../nexus-config" }
nexus-emoji = { path = "../nexus-emoji" }
nexus-symbols = { path = "../nexus-symbols" }
nexus-gif = { path = "../nexus-gif" }
